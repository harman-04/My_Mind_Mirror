# ==========================================
# SPRING BOOT CONFIGURATION
# ==========================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=backend

# Server
server.port=${SERVER_PORT}
server.address=0.0.0.0

# ==========================================
# SPRING AI - GOOGLE GEMINI
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite


# ==========================================
# POSTGRESQL (PGVECTOR)
# ==========================================
app.datasource.vector.url=${VECTOR_DB_URL}
app.datasource.vector.username=${VECTOR_DB_USERNAME}
app.datasource.vector.password=${VECTOR_DB_PASSWORD}
app.datasource.vector.driver-class-name=org.postgresql.Driver

# Spring AI Vector Store Settings
# This tells Spring Boot to automatically create the vector_store table in Postgres!
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# ==========================================
# MYSQL DATABASE
# ==========================================
app.datasource.mysql.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/mymindmirror_db}
app.datasource.mysql.username=${DATASOURCE_USERNAME:root}
app.datasource.mysql.password=${DATASOURCE_PASSWORD:root}
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Disable JPA open-in-view to prevent session issues
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# JWT Secret Key (Crucial for Security!)
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION}

# CORS Configuration for React Frontend
# This allows your React app (running on port 3000) to communicate with Spring Boot (on 8080).
spring.web.cors.allowed-origins=${WEB_CORE_ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=${WEB_CORE_ALLOWED_METHODS}
spring.web.cors.allowed-headers=${WEB_CORE_ALLOWED_HEADERS}
spring.web.cors.allow-credentials=true


# ==========================================
# CORS Configuration (for React frontend)
# Comma-separated list of allowed origins (no trailing slash!)
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


# ==========================================
# REDIS CACHE
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.cache.type=${SPRING_CACHE_TYPE}
spring.data.redis.timeout=2000ms


# ==========================================
# ENCRYPTION Master key for field encryption (256-bit AES)
# ==========================================
app.encryption.master-key=${ENCRYPTION_MASTER_KEY}



# ==========================================
# RESPONSE COMPRESSION
# ==========================================
server.compression.enabled=${SERVER_COMPRESSION_ENABLED}
server.compression.mime-types=${SERVER_COMPRESSION_MIME_TYPES}
server.compression.min-response-size=${SERVER_COMPRESSION_MIN_RESPONSE_SIZE}


# ==========================================
# VIRTUAL THREADS
# ==========================================
spring.threads.virtual.enabled=true

# ==========================================
# RAG / SEMANTIC SEARCH
# ==========================================
rag.backfill.enabled=false

app.rag.similarity-threshold=0.55
app.rag.similarity-threshold-fallback=0.50
app.rag.top-k=10
app.rag.top-k-reflective=5
app.rag.top-k-fallback=4

# ==========================================
# ANOMALY DETECTION
# ==========================================
app.anomaly.ewma-span=7
app.anomaly.mood-threshold-std=0.6
app.anomaly.words-threshold-std=0.8
app.anomaly.min-days=5

# ==========================================
# ACTUATOR / HEALTH CHECKS
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


info.app.name=MyMindMirror Backend
info.app.version=@project.version@
info.app.description=MyMindMirror AI Journaling Backend


# ==========================================
# LOGGING
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis.cache=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseEntityExceptionHandler=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# OTHER
# ==========================================
spring.sql.init.mode=never
backfill.enabled=false




