spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# Server Port for Spring Boot
server.port=${SERVER_PORT}


# MySQL Database Configuration
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/mymindmirror_db}

spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable JPA open-in-view to prevent session issues
spring.jpa.open-in-view=false

# Flask ML Service URL
# This is where your Spring Boot app will send requests for AI analysis.
app.ml-service.url=${ML_SERVICE_URL:http://localhost:5000}

# JWT Secret Key (Crucial for Security!)
# GENERATE A STRONG, RANDOM KEY! Do NOT use "yourVerySecretKeyThatIsLongAndRandomForJWT" in production.
# You can generate one online or use a command like:
# openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION}

# CORS Configuration for React Frontend
# This allows your React app (running on port 3000) to communicate with Spring Boot (on 8080).
spring.web.cors.allowed-origins=${WEB_CORE_ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=${WEB_CORE_ALLOWED_METHODS}
spring.web.cors.allowed-headers=${WEB_CORE_ALLOWED_HEADERS}
spring.web.cors.allow-credentials=true


# Master key for field encryption (256-bit AES)
app.encryption.master-key=${ENCRYPTION_MASTER_KEY}

# Resilience4j Circuit Breaker configuration
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mlServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true


spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis.cache=TRACE
# Enable response compression
server.compression.enabled=${SERVER_COMPRESSION_ENABLED}
server.compression.mime-types=${SERVER_COMPRESSION_MIME_TYPES}
server.compression.min-response-size=${SERVER_COMPRESSION_MIN_RESPONSE_SIZE}


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
# If you use a password (optional)
spring.cache.type=${SPRING_CACHE_TYPE}
# Timeout (optional)
spring.data.redis.timeout=2000ms


backfill.enabled=false

spring.sql.init.mode=never

#reencrypt.plaintext.enabled=true